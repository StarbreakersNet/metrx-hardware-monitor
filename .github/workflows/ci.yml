# Lint, format, Clippy et tests Rust, build du front et du sidecar, qui est lancé pour vérifier
# qu'il répond (Linux). Tourne :
# - sur les pull requests vers main prêtes à être relues (pas en brouillon) et qui
#   touchent autre chose que la documentation
# - à chaque release : deploy.yml appelle ce workflow (workflow_call) avant les builds par OS,
#   qui ne démarrent que s'il réussit
#
# Les builds par OS (installeurs) ne tournent qu'à la release. Pour tester les installeurs d'une
# branche : installers.yml (onglet Actions > Test installers > Run workflow).
name: CI

on:
  pull_request:
    branches:
      - main
    # ready_for_review : passage d'une PR brouillon à « Ready for review »
    types: [opened, reopened, synchronize, ready_for_review]
    # Une PR qui ne modifie que ces fichiers ne relance pas la CI
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".vscode/**"
  # Appelé par deploy.yml avant les builds de la release
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & tests
    # Pas de CI sur les PR en brouillon (elle se lance au passage en « Ready for review »)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    # Prend 2 à 4 minutes : au-delà, un blocage (ex : miroir apt) ne doit pas occuper le runner 6 h
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependency
        run: yarn install --immutable

      - name: ESLint
        run: yarn eslint .

      - name: Prettier
        run: yarn prettier --check .

      - name: Build frontend
        run: yarn vite:build

      # tauri-build vérifie que le sidecar existe avant de compiler
      - name: Build sidecar
        run: yarn sidecar:build

      - name: Check sidecar
        timeout-minutes: 3
        run: node .github/scripts/check-sidecar.js src-tauri/binaries/metrx-metrics-x86_64-unknown-linux-gnu

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
