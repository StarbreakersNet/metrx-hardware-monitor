name: Build & release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  prepare_build:
    name: Prepare build variables
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      channel: ${{ steps.set-release-info.outputs.channel }}
      release_type: ${{ steps.set-release-info.outputs.release_type }}
      should_release: ${{ steps.set-release-info.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nécessaire pour accéder aux tags

      - name: Extract version from tag
        id: set-version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          echo "version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set release type and channel
        id: set-release-info
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          SHOULD_RELEASE="true"

          if [[ "$VERSION" == *"-beta"* ]]; then
            RELEASE_TYPE="prerelease"
            CHANNEL="beta"
          elif [[ "$VERSION" == *"-alpha"* ]]; then
            RELEASE_TYPE="prerelease"
            CHANNEL="alpha"
          elif [[ "$VERSION" == *"-"* ]]; then
            SHOULD_RELEASE="false"
            RELEASE_TYPE="skip"
            CHANNEL="none"
          else
            RELEASE_TYPE="release"
            CHANNEL="latest"
          fi

          echo "release type: $RELEASE_TYPE"
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "channel: $CHANNEL"
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      # Les notes de release sont tirées de la première section numérotée du CHANGELOG :
      # elle doit être celle de la version du tag (voir README > Releases, `yarn release`)
      - name: Check CHANGELOG entry
        if: steps.set-release-info.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          LATEST=$(grep -m1 -oE '^## \[[0-9][^]]*\]' CHANGELOG.md || true)

          if [ "$LATEST" != "## [$VERSION]" ]; then
            echo "::error::La dernière section du CHANGELOG est « ${LATEST:-aucune} » au lieu de « ## [$VERSION] ». Préparer la release avec « yarn release $VERSION », puis replacer le tag."
            exit 1
          fi

      - name: Check updater public key
        run: |
          if grep -q "REMPLACER_PAR_LA_CLE_PUBLIQUE" src-tauri/tauri.conf.json; then
            echo "::error::La clé publique de l'updater n'est pas configurée dans src-tauri/tauri.conf.json (plugins.updater.pubkey). Voir README > Mises à jour."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG file
        uses: ffurrer2/extract-release-notes@v3
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: release-notes.md

      - name: Upload release-notes.md
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare_build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
          # Ubuntu 22.04 : la plus ancienne base supportée, pour que l'AppImage et le .deb
          # fonctionnent aussi sur les distributions moins récentes (glibc)
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Update package.json version
        run: yarn version ${{ needs.prepare_build.outputs.version }}

      - name: Install dependency
        run: yarn install --immutable

      # Le sidecar (Bun) est compilé automatiquement par `beforeBuildCommand` (voir tauri.conf.json).
      # Une étape par cas, qui ne reçoit que les secrets dont elle a besoin : Tauri considère une
      # variable vide comme définie (il tenterait par exemple de notariser avec un Team ID vide).
      - name: Build & package with Tauri
        if: matrix.platform != 'macos'
        run: yarn tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
        env:
          # Signature des mises à jour
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature Windows : à brancher ici une fois le fournisseur choisi (voir README)

      # macOS : signature (mêmes secrets que la version Electron) et notarisation. La notarisation
      # nécessite un abonnement Apple Developer Program actif : pour publier une version signée mais
      # non notarisée, créer la variable de dépôt MACOS_NOTARIZE=false
      # (Settings > Secrets and variables > Actions > Variables).
      - name: Build, sign & notarize with Tauri
        if: matrix.platform == 'macos' && vars.MACOS_NOTARIZE != 'false'
        run: yarn tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build & sign with Tauri (not notarized)
        if: matrix.platform == 'macos' && vars.MACOS_NOTARIZE == 'false'
        run: yarn tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Collect artefacts
        shell: bash
        run: |
          BUNDLE=src-tauri/target/${{ matrix.target }}/release/bundle
          VERSION=${{ needs.prepare_build.outputs.version }}
          mkdir -p artefacts

          case "${{ matrix.platform }}" in
            windows)
              cp "$BUNDLE"/nsis/*-setup.exe "$BUNDLE"/nsis/*-setup.exe.sig artefacts/
              ;;
            macos)
              cp "$BUNDLE"/dmg/*.dmg artefacts/
              # L'archive de mise à jour n'a ni version ni architecture dans son nom par défaut
              cp "$BUNDLE"/macos/*.app.tar.gz "artefacts/Metrx_${VERSION}_aarch64.app.tar.gz"
              cp "$BUNDLE"/macos/*.app.tar.gz.sig "artefacts/Metrx_${VERSION}_aarch64.app.tar.gz.sig"
              ;;
            linux)
              cp "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/appimage/*.AppImage.sig artefacts/
              cp "$BUNDLE"/deb/*.deb "$BUNDLE"/deb/*.deb.sig artefacts/
              ;;
          esac

          ls -la artefacts

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: artefacts-${{ matrix.platform }}
          path: artefacts/*

  create_release:
    name: Create GitHub Release
    needs: [prepare_build, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.prepare_build.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release-notes.md
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Download artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: artefacts-*
          path: dist
          merge-multiple: true

      # Manifeste lu par l'updater de l'application (voir src-tauri/src/updater.rs)
      - name: Generate latest.json
        run: >
          node .github/scripts/updater-manifest.js
          --dir dist
          --version "${{ needs.prepare_build.outputs.version }}"
          --tag "${{ needs.prepare_build.outputs.version }}"
          --repository "${{ github.repository }}"
          --notes release-notes.md
          --output dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare_build.outputs.version }}
          name: ${{ needs.prepare_build.outputs.version }}
          body_path: release-notes.md
          draft: ${{ needs.prepare_build.outputs.release_type == 'draft' }}
          prerelease: ${{ needs.prepare_build.outputs.release_type == 'prerelease' }}
          # Les signatures (.sig) sont intégrées dans latest.json, inutile de les publier
          files: |
            dist/latest.json
            dist/*-setup.exe
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.AppImage
            dist/*.deb
