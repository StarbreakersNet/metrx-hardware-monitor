[package]
name = "metrx"
# La version de l'application est lue depuis package.json (voir tauri.conf.json)
version = "0.0.0"
description = "Metrx hardware monitor"
authors = ["TheRedfoox"]
license = "GPL-3.0-or-later"
repository = "https://github.com/StarbreakersNet/metrx-hardware-monitor"
edition = "2024"
rust-version = "1.85"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
name = "metrx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `devtools` : permet d'ouvrir les outils de développement en production (clic droit sur l'icône bug)
tauri = { version = "2.12", features = ["tray-icon", "image-png", "image-ico", "devtools"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-shell = "2.6"
tauri-plugin-store = "2.5"
# Mêmes options TLS que tauri-plugin-updater pour ne compiler qu'une seule pile (rustls + ring)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sys-locale = "0.3"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
